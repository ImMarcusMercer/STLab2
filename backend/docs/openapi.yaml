  /api/v1/academic-terms:
    get:
      operationId: v1_academic_terms_list
      description: |-
        Keep validation and persistence in one SQLite IMMEDIATE transaction.

        This serializes writers before capacity checks and prevents over-enrollment.
        Reads do not acquire a write lock.
      parameters:
      - in: query
        name: academic_year
        schema:
          type: string
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      - name: per_page
        required: false
        in: query
        description: Number of results to return per page.
        schema:
          type: integer
      - name: search
        required: false
        in: query
        description: A search term.
        schema:
          type: string
      - in: query
        name: semester
        schema:
          type: string
          enum:
          - FIRST
          - SECOND
          - SUMMER
        description: |-
          * `FIRST` - First
          * `SECOND` - Second
          * `SUMMER` - Summer
      - name: sort
        required: false
        in: query
        description: Which field to use when ordering the results.
        schema:
          type: string
      - in: query
        name: status
        schema:
          type: string
          enum:
          - ACTIVE
          - INACTIVE
        description: |-
          * `ACTIVE` - Active
          * `INACTIVE` - Inactive
      tags:
      - Academic Terms
      security:
      - tokenAuth: []
      responses:
        '200':
